name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { os: darwin, arch: arm64 }
          - { os: darwin, arch: amd64 }
          - { os: linux,  arch: amd64 }
          - { os: linux,  arch: arm64 }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: 构建 ${{ matrix.os }}/${{ matrix.arch }}
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="dev"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "dist/nxmem-${{ matrix.os }}-${{ matrix.arch }}" ./cmd/nxmem

      - name: 冒烟测试
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        run: |
          ./dist/nxmem-linux-amd64 version
          TMP=$(mktemp -d)
          NXMEM_HOME=$TMP ./dist/nxmem-linux-amd64 demo
          NXMEM_HOME=$TMP NXMEM_ADMIN_TOKEN=smoke ./dist/nxmem-linux-amd64 serve --addr 127.0.0.1:18861 --static ./static &
          sleep 2
          curl -fsS http://127.0.0.1:18861/healthz
          curl -fsS http://127.0.0.1:18861/api/overview | head -c 120

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}-${{ matrix.arch }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        run: cd dist && sha256sum nxmem-* > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/nxmem-*
            dist/SHA256SUMS
          generate_release_notes: true

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
