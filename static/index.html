<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nxmem · 共享记忆与项目进度</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#111821; --panel2:#0e151d; --line:#1e2a36;
    --txt:#dbe6ef; --dim:#7d8fa1; --accent:#2dd4bf; --accent2:#1F6F6B;
    --warn:#f0b429; --bad:#ef4444; --ok:#22c55e; --blue:#60a5fa; --purple:#a78bfa;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:14px 22px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#0f1620,#0b0f14);position:sticky;top:0;z-index:9}
  .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    display:grid;place-items:center;font-weight:700;color:#06110f;font-size:13px}
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.5px}
  .sub{color:var(--dim);font-size:12px}
  .spacer{flex:1}
  .kpi{display:flex;gap:10px;flex-wrap:wrap}
  .kpi div{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12px}
  .kpi b{color:var(--accent);font-size:15px;margin-right:4px}
  nav{display:flex;gap:4px;padding:10px 22px;border-bottom:1px solid var(--line);background:var(--panel2);
    position:sticky;top:57px;z-index:8;flex-wrap:wrap}
  nav button{background:transparent;border:1px solid transparent;color:var(--dim);padding:6px 14px;
    border-radius:7px;cursor:pointer;font-size:13px;font-family:inherit}
  nav button:hover{color:var(--txt);background:#16202b}
  nav button.on{color:#06110f;background:var(--accent);font-weight:600}
  main{padding:20px 22px 60px}
  section{display:none} section.on{display:block}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
  .card h2{font-size:13px;margin:0 0 12px;color:var(--dim);font-weight:600;letter-spacing:.6px;text-transform:uppercase}
  svg{display:block;width:100%;height:auto}
  .legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--dim);font-size:12px;margin-top:10px}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;color:var(--dim);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--line);
    font-size:12px;white-space:nowrap}
  td{padding:8px 10px;border-bottom:1px solid #16202b;vertical-align:top}
  tr:hover td{background:#131c26}
  .tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;border:1px solid var(--line);color:var(--dim)}
  .s-done{color:var(--ok);border-color:#1d4d33}
  .s-doing{color:var(--blue);border-color:#1e3a5f}
  .s-todo{color:var(--dim)}
  .s-blocked{color:var(--bad);border-color:#5b1f1f}
  .s-conflict{color:#fb7185;border-color:#6b1f2e;background:#2a1218}
  .s-stale{color:#f0b429;border-color:#4d3d12;background:#221a08}
  .s-active{color:#22c55e;border-color:#1d4d33}
  .s-待确认,.s-方案阶段{color:var(--warn);border-color:#4d3d12}
  .bar{height:5px;background:#1a2530;border-radius:3px;overflow:hidden;min-width:70px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent))}
  .muted{color:var(--dim)}
  .tooltip{position:fixed;pointer-events:none;background:#0a1017;border:1px solid var(--accent2);
    border-radius:8px;padding:8px 10px;font-size:12px;opacity:0;transition:opacity .12s;max-width:280px;z-index:99;
    box-shadow:0 8px 24px rgba(0,0,0,.5)}
  .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
  .k{color:var(--dim);font-size:12px}
  .v{font-size:13px}
  code{background:#0a1017;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:12px;color:var(--accent)}
  footer{color:#4a5a6a;font-size:12px;padding:0 22px 30px}
</style>
</head>
<body>
<header>
  <div class="logo">NX</div>
  <div>
    <h1>nxmem</h1>
    <div class="sub" id="sub">共享记忆 · 项目 · 过程 —— 只读看板</div>
  </div>
  <div class="spacer"></div>
  <div class="kpi" id="kpi"></div>
</header>

<nav>
  <button class="on" data-tab="graph">关系图谱</button>
  <button data-tab="gantt">项目甘特</button>
  <button data-tab="projects">项目</button>
  <button data-tab="memories">共享记忆</button>
  <button data-tab="steps">过程记录</button>
  <button data-tab="audit">访问审计</button>
</nav>

<main>
  <section id="graph" class="on">
    <div class="card">
      <h2>实体关系图谱 · 点击节点查看邻居</h2>
      <svg id="graphSvg" viewBox="0 0 1200 740" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="legend" id="legend"></div>
    </div>
  </section>

  <section id="gantt">
    <div class="card">
      <h2>项目甘特 · 任务与进度</h2>
      <svg id="ganttSvg" viewBox="0 0 1200 620" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
  </section>

  <section id="projects"><div class="card"><h2>项目清单</h2><table id="tProjects"></table></div></section>
  <section id="memories"><div class="card"><h2>共享记忆（供各 agent 检索）</h2><table id="tMemories"></table></div></section>
  <section id="steps"><div class="card"><h2>过程记录</h2><table id="tSteps"></table></div></section>
  <section id="audit"><div class="card"><h2>最近 100 条访问审计</h2><table id="tAudit"></table></div></section>
</main>
<footer>只读界面：所有写入通过 MCP 由 agent 完成 · 单二进制 + SQLite ·
  <a href="#" onclick="localStorage.removeItem('nxmem_token');location.reload();return false;">更换令牌</a></footer>
<div class="tooltip" id="tip"></div>

<script>
const COLORS = {company:"#2dd4bf",person:"#f0b429",project:"#60a5fa",client:"#a78bfa",
  agent:"#f472b6",system:"#f472b6",tool:"#34d399",default:"#94a3b8"};
const TYPE_CN = {company:"公司",person:"人",project:"项目",client:"客户",agent:"agent",system:"系统",tool:"工具"};
const $ = s => document.querySelector(s);
const tip = $("#tip");

// 读接口也校验令牌：图谱/记忆里有客户名、内网 IP 与人员身份。
function nxToken(){ return localStorage.getItem("nxmem_token") || ""; }
function askToken(){
  const t = prompt("该接口需要 nxmem 令牌（Header: X-Nxmem-Token）。\n令牌由管理员执行 nxmem agent add 生成，只显示一次。");
  if (t && t.trim()) { localStorage.setItem("nxmem_token", t.trim()); location.reload(); }
}
async function api(p){
  const tok = nxToken();
  const r = await fetch(p,{cache:"no-store", headers: tok ? {"X-Nxmem-Token": tok} : {}});
  if (r.status === 401 || r.status === 403) { if (!tok) askToken(); return {error: r.status === 403 ? "forbidden" : "unauthorized"}; }
  return r.json();
}

function showTip(e, html){
  tip.innerHTML = html; tip.style.opacity = 1;
  tip.style.left = Math.min(e.clientX+14, innerWidth-300)+"px";
  tip.style.top  = (e.clientY+14)+"px";
}
function hideTip(){ tip.style.opacity = 0; }

/* ---------- 图谱 ---------- */
let GRAPH = {nodes:[],edges:[]};

function layout(nodes, edges){
  const byType = {};
  nodes.forEach(n=>{ (byType[n.type] = byType[n.type]||[]).push(n); });
  const types = Object.keys(byType);
  const cx=600, cy=350, R=300;
  types.forEach((t,ti)=>{
    const ang = (ti/types.length)*Math.PI*2 - Math.PI/2;
    const gx = cx + Math.cos(ang)*R*0.82, gy = cy + Math.sin(ang)*R*0.62;
    byType[t].forEach((n,i)=>{
      const k = byType[t].length;
      const a2 = (i/Math.max(k,1))*Math.PI*2;
      const r2 = k===1 ? 0 : 120 + 42*Math.floor(i/5);
      n.x = gx + Math.cos(a2)*r2; n.y = gy + Math.sin(a2)*r2;
    });
  });
  const idx = {}; nodes.forEach(n=>idx[n.id||n.name]=n);
  // 轻量力导向：斥力 + 边吸引 + 向心
  for(let it=0; it<220; it++){
    nodes.forEach(a=>{ nodes.forEach(b=>{ if(a===b) return;
      let dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy+0.01;
      if(d2<46000){ const f=900/d2; a.x-=dx*f; a.y-=dy*f; b.x+=dx*f; b.y+=dy*f; }
    });});
    edges.forEach(e=>{ const a=idx[e.src], b=idx[e.dst]; if(!a||!b) return;
      let dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1;
      const f=(d-195)*0.006; a.x+=dx/d*f*40; a.y+=dy/d*f*40; b.x-=dx/d*f*40; b.y-=dy/d*f*40;
    });
    nodes.forEach(n=>{ n.x += (cx-n.x)*0.004; n.y += (cy-n.y)*0.004; });
  }
  nodes.forEach(n=>{ n.x=Math.max(100,Math.min(1100,n.x)); n.y=Math.max(70,Math.min(660,n.y)); });
}

function renderGraph(){
  const svg = $("#graphSvg");
  const {nodes, edges} = GRAPH;
  if(!nodes.length){ svg.innerHTML = '<text x="600" y="360" fill="#7d8fa1" text-anchor="middle">暂无数据</text>'; return; }
  layout(nodes, edges);
  const idx={}; nodes.forEach(n=>idx[n.id||n.name]=n);
  const parts=[];
  // 边
  edges.forEach((e,i)=>{
    const a=idx[e.src], b=idx[e.dst]; if(!a||!b) return;
    parts.push(`<line data-edge="${i}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"
      stroke="#33506a" stroke-width="1.6"/>`);
    const dx=b.x-a.x, dy=b.y-a.y, len=Math.hypot(dx,dy)||1;
    const off=(i%2?1:-1)*11;
    const mx=(a.x+b.x)/2 + (-dy/len)*off, my=(a.y+b.y)/2 + (dx/len)*off;
    if(e.rel) parts.push(`<text x="${mx}" y="${my-5}" fill="#8fb0c9" font-size="12" text-anchor="middle"
        stroke="#0b0f14" stroke-width="3" paint-order="stroke">${e.rel}</text>`);
  });
  // 节点
  nodes.forEach(n=>{
    const c = COLORS[n.type]||COLORS.default;
    const r = n.type==="company"?30 : n.type==="project"?23 : 17;
    let meta={}; try{ meta=JSON.parse(n.meta||"{}"); }catch(_){}
    const sub = meta.ip || (n.type==="person"&&meta.role) || "";
    parts.push(`<g class="node" data-name="${n.id||n.name}" style="cursor:pointer">
      <circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${c}22" stroke="${c}" stroke-width="1.8"/>
      <circle cx="${n.x}" cy="${n.y}" r="3" fill="${c}"/>
      <text x="${n.x}" y="${n.y+r+16}" fill="#eef6ff" font-size="15" font-weight="600" text-anchor="middle"
        stroke="#0b0f14" stroke-width="3" paint-order="stroke">${n.name}</text>
      ${sub?`<text x="${n.x}" y="${n.y+r+31}" fill="#7d97ab" font-size="11" text-anchor="middle"
          stroke="#0b0f14" stroke-width="2.5" paint-order="stroke">${sub}</text>`:""}
    </g>`);
  });
  svg.innerHTML = parts.join("");
  svg.querySelectorAll(".node").forEach(g=>{
    const n = idx[g.dataset.name];
    g.addEventListener("mousemove", e=>{
      const nb = edges.filter(x=>x.src===n.name||x.dst===n.name)
        .map(x=> x.src===n.name ? `${x.rel}→${x.dst}` : `${x.src}→${x.rel}`).slice(0,6);
      showTip(e, `<b>${n.name}</b><br><span style="color:#7d8fa1">${TYPE_CN[n.type]||n.type}</span>
        ${nb.length?"<br>"+nb.join("<br>"):""}`);
    });
    g.addEventListener("mouseleave", hideTip);
    g.addEventListener("click", ()=>{
      const names = new Set([n.name]);
      edges.forEach(x=>{ if(x.src===n.name) names.add(x.dst); if(x.dst===n.name) names.add(x.src); });
      svg.querySelectorAll(".node").forEach(el=>{
        el.style.opacity = names.has(el.dataset.name) ? 1 : 0.18;
      });
      svg.querySelectorAll("line").forEach((l,i)=>{
        const e = edges[i]; if(!e) return;
        l.style.opacity = (e.src===n.name||e.dst===n.name) ? 1 : 0.12;
      });
    });
  });
  $("#legend").innerHTML = Object.keys(COLORS).filter(k=>k!=="default")
    .map(k=>`<span><i style="background:${COLORS[k]}"></i>${TYPE_CN[k]||k}</span>`).join("");
}

/* ---------- 甘特 ---------- */
function parseD(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function renderGantt(data){
  const svg = $("#ganttSvg");
  const rows = [];
  (data.projects||[]).forEach(p=>{
    rows.push({kind:"project", name:p.name, code:p.code, s:parseD(p.start_date||p.due_date||new Date().toISOString().slice(0,10)),
      e:parseD(p.due_date||p.start_date), prog:p.progress||0, status:p.status});
  });
  const tasks = (data.tasks||[]).filter(t=>t.start_date&&t.end_date);
  const all = rows.concat(tasks.map(t=>({kind:"task", name:t.name, code:t.project_code,
    s:parseD(t.start_date), e:parseD(t.end_date), prog:t.progress||0, status:t.status})));
  if(!all.length){ svg.innerHTML='<text x="600" y="300" fill="#7d8fa1" text-anchor="middle">暂无任务</text>'; return; }
  const min = new Date(Math.min(...all.map(r=>r.s))); min.setDate(1);
  const max = new Date(Math.max(...all.map(r=>r.e))); max.setDate(1); max.setMonth(max.getMonth()+1);
  const W=1200, L=380, R=40, top=54, rowH=32;
  const days = (max-min)/86400000;
  const x = d => L + ((d-min)/86400000)/days*(W-L-R);
  const H = top + all.length*rowH + 40;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const p=[];
  // 月网格
  let cur = new Date(min);
  while(cur < max){
    const x0 = x(cur);
    const nx = new Date(cur); nx.setMonth(nx.getMonth()+1);
    p.push(`<line x1="${x0}" y1="${top-20}" x2="${x0}" y2="${H-30}" stroke="#16202b"/>`);
    p.push(`<text x="${x0+4}" y="${top-26}" fill="#7d97ab" font-size="13">${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,"0")}</text>`);
    cur = nx;
  }
  // 标签列分隔线
  p.push(`<line x1="${L-6}" y1="${top-20}" x2="${L-6}" y2="${H-30}" stroke="#243444"/>`);
  // 今天
  const today = new Date();
  if(today>=min && today<=max){
    p.push(`<line x1="${x(today)}" y1="${top-18}" x2="${x(today)}" y2="${H-30}" stroke="#ef4444" stroke-dasharray="3 3" opacity=".7"/>`);
    p.push(`<text x="${x(today)+3}" y="${top-24}" fill="#ef4444" font-size="10">今天</text>`);
  }
  let grouped = {};
  all.forEach(r=>{ (grouped[r.code]=grouped[r.code]||[]).push(r); });
  let i=0;
  Object.keys(grouped).forEach(code=>{
    grouped[code].forEach((r, j)=>{
      const y = top + i*rowH;
      const c = r.kind==="project" ? "#60a5fa" : "#2dd4bf";
      const x1 = x(r.s), x2 = Math.max(x(r.e), x1+4);
      const label = (j===0 && r.kind==="task") ? code : "";
      if(label) p.push(`<text x="8" y="${y+rowH/2+4}" fill="#6b8299" font-size="12">${label}</text>`);
      p.push(`<text x="${r.kind==="project"?L-14:L-30}" y="${y+rowH/2+4}" fill="${r.kind==="project"?"#e8f1f8":"#9fb0c0"}"
        font-size="${r.kind==="project"?16:15}" font-weight="${r.kind==="project"?600:400}" text-anchor="end"
        stroke="#0b0f14" stroke-width="3" paint-order="stroke">${r.name.length>16?r.name.slice(0,15)+"…":r.name}</text>`);
      p.push(`<rect x="${x1}" y="${y+5}" width="${x2-x1}" height="14" rx="4" fill="${c}22" stroke="${c}55"/>`);
      const pw = (x2-x1)*(Math.max(0,Math.min(100,r.prog))/100);
      if(pw>0) p.push(`<rect x="${x1}" y="${y+5}" width="${pw}" height="14" rx="4" fill="${c}aa"/>`);
      p.push(`<title>${r.name} ${r.s.toISOString().slice(0,10)} → ${r.e.toISOString().slice(0,10)} · ${r.prog}%</title>`);
      i++;
    });
  });
  svg.innerHTML = p.join("");
}

/* ---------- 表格 ---------- */
const esc = s => String(s??"").replace(/[&<>]/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m]));
const stTag = s => `<span class="tag s-${esc(s||"todo")}">${esc(s||"-")}</span>`;
const bar = v => `<div class="bar"><i style="width:${Math.max(0,Math.min(100,v||0))}%"></i></div>`;

function renderProjects(list){
  $("#tProjects").innerHTML = `<tr><th>编号</th><th>项目</th><th>客户</th><th>状态</th><th>进度</th><th>起</th><th>止</th><th>说明</th></tr>`
   + list.map(p=>`<tr><td><code>${esc(p.code)}</code></td><td><b>${esc(p.name)}</b></td>
     <td class="muted">${esc(p.client)}</td><td>${stTag(p.status)}</td>
     <td style="min-width:110px">${bar(p.progress)}<span class="muted" style="font-size:11px">${p.progress||0}%</span></td>
     <td class="muted">${esc(p.start_date)}</td><td class="muted">${esc(p.due_date)}</td>
     <td class="muted" style="max-width:320px">${esc(p.summary)}</td></tr>`).join("");
}
function renderMemories(list){
  const badge = s => s==="conflict" ? '<span class="tag s-conflict">冲突待裁决</span>'
                  : s==="stale" ? '<span class="tag s-stale">待复核</span>'
                  : '<span class="tag s-active">有效</span>';
  $("#tMemories").innerHTML = `<tr><th>范围</th><th>键</th><th>内容</th><th>状态</th><th>有效期</th><th>最后核实</th><th>更新</th></tr>`
   + list.map(m=>`<tr><td><span class="tag">${esc(m.scope)}</span></td><td><code>${esc(m.key)}</code></td>
     <td>${esc(m.content)}${m.valid_for?`<div class="muted" style="font-size:11px">适用：${esc(m.valid_for)}</div>`:""}</td>
     <td>${badge(m.status||"active")}</td>
     <td class="muted">${m.ttl_days?m.ttl_days+" 天":"永久"}</td>
     <td class="muted">${esc(m.verified_at||"-")}</td>
     <td class="muted">${esc(m.updated_at)}</td></tr>`).join("");
}
function renderSteps(list){
  $("#tSteps").innerHTML = `<tr><th>项目</th><th>#</th><th>步骤</th><th>状态</th><th>细节</th><th>执行</th><th>时间</th></tr>`
   + list.map(s=>`<tr><td><code>${esc(s.project_code)}</code></td><td class="muted">${s.seq}</td>
     <td>${esc(s.title)}</td><td>${stTag(s.status)}</td><td class="muted">${esc(s.detail)}</td>
     <td class="muted">${esc(s.agent)}</td><td class="muted">${esc(s.created_at)}</td></tr>`).join("");
}
function renderAudit(list){
  $("#tAudit").innerHTML = `<tr><th>时间</th><th>调用方</th><th>动作</th><th>对象</th><th>结果</th></tr>`
   + list.map(a=>`<tr><td class="muted">${esc(a.ts)}</td><td>${esc(a.agent)}</td>
     <td><code>${esc(a.action)}</code></td><td class="muted">${esc(a.target)}</td>
     <td>${a.ok?'<span class="tag s-done">ok</span>':'<span class="tag s-blocked">fail</span>'}</td></tr>`).join("");
}

/* ---------- 引导 ---------- */
function applyModules(m){
  const mem = (m !== "keys"), keys = (m !== "memory");
  const map = {graph:mem, gantt:mem, projects:mem, memories:mem, secrets:keys, steps:mem, audit:true};
  document.querySelectorAll("nav button").forEach(b=>{
    const show = map[b.dataset.tab] !== false;
    b.style.display = show ? "" : "none";
  });
  const on = document.querySelector("nav button.on");
  if (on && on.style.display === "none") {
    const first = [...document.querySelectorAll("nav button")].find(b=>b.style.display !== "none");
    if (first) first.click();
  }
  document.title = "nxmem · 共享记忆与项目进度";
}

async function load(){
  const meta = await api("/api/meta"); applyModules(meta.modules);
  const ov = await api("/api/overview");
  $("#sub").textContent = `共享记忆 · 项目 · 过程 —— 只读看板 · 更新于 ${ov.ts}`;
  $("#kpi").innerHTML = [
    ["项目", ov.counts.projects], ["任务", ov.counts.tasks], ["记忆", ov.counts.memories],
    ["过程", ov.counts.steps||0], ["agent", ov.counts.agents||0]
  ].map(([k,v])=>`<div><b>${v}</b>${k}</div>`).join("")
  + (ov.alerts && ov.alerts.conflict ? `<div style="border-color:#6b1f2e;color:#fb7185"><b style="color:#fb7185">${ov.alerts.conflict}</b>冲突</div>` : "")
  + (ov.alerts && ov.alerts.stale ? `<div style="border-color:#4d3d12;color:#f0b429"><b style="color:#f0b429">${ov.alerts.stale}</b>待复核</div>` : "");
  renderProjects(ov.projects);

  GRAPH = await api("/api/graph");
  if (GRAPH.error) { const s=$("#graphSvg"); if (s) s.innerHTML = '<text x="600" y="340" text-anchor="middle" fill="#f0b429" font-size="16">图谱需要令牌：点右下角「更换令牌」输入</text>'; return; }
  renderGraph();
  renderGantt(await api("/api/gantt"));
  renderMemories(await api("/api/memories"));
  renderSteps(await api("/api/steps"));
  renderAudit(await api("/api/audit"));
}

document.querySelectorAll("nav button").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll("nav button").forEach(x=>x.classList.remove("on"));
    document.querySelectorAll("section").forEach(x=>x.classList.remove("on"));
    b.classList.add("on"); $("#"+b.dataset.tab).classList.add("on");
    if(b.dataset.tab==="graph") renderGraph();
  };
});

load().catch(e=>{ $("#sub").textContent = "加载失败："+e; });
setInterval(()=>{ load().catch(()=>{}); }, 60000);
</script>
</body>
</html>
